  <script>
    // Backend shim — replaces window.claude.complete with a call to our serverless function
    window.claude = {
      complete: async (input) => {
        const messages = typeof input === 'string'
          ? [{ role: 'user', content: input }]
          : input.messages;
        const res = await fetch('/api/claude', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ messages }),
        });
        if (!res.ok) throw new Error('AI request failed: ' + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        return data.text;
      }
    };

// ── Moon phase ────────────────────────────────────────────────────────────────

function getMoonPhase(year, monthIdx) {
  const date = new Date(year, monthIdx, 15);
  const ref = new Date('2000-01-06T18:14:00Z');
  const days = (date - ref) / 86400000;
  const cycle = 29.53059;
  return ((days % cycle) + cycle) % cycle;
}

function getMoonPhaseName(p) {
  if (p < 1.85) return 'New Moon';
  if (p < 7.38) return 'Waxing Crescent';
  if (p < 9.22) return 'First Quarter';
  if (p < 14.77) return 'Waxing Gibbous';
  if (p < 16.61) return 'Full Moon';
  if (p < 22.15) return 'Waning Gibbous';
  if (p < 23.99) return 'Last Quarter';
  return 'Waning Crescent';
}

function MoonSVG({ phase }) {
  const r = 26, cx = 40, cy = 40;
  const gold = "rgba(201,168,76,0.88)";
  const dark = "#0d0d1a";
  const isWaxing = phase <= 14.77;
  const illum = isWaxing ? phase / 14.77 : (29.53 - phase) / 14.76;
  const termRx = r * Math.abs(1 - 2 * illum);
  const termIsLight = illum > 0.5;

  return (
    <svg width="80" height="80" viewBox="0 0 80 80">
      <defs>
        <clipPath id="mc"><circle cx={cx} cy={cy} r={r}/></clipPath>
      </defs>
      <circle cx={cx} cy={cy} r={r} fill={gold}/>
      {illum < 0.98 && (
        <g clipPath="url(#mc)">
          {isWaxing
            ? <rect x={cx-r} y={cy-r} width={r} height={r*2} fill={dark}/>
            : <rect x={cx}   y={cy-r} width={r} height={r*2} fill={dark}/>
          }
          {termRx > 0.5 && (
            <ellipse cx={cx} cy={cy} rx={termRx} ry={r} fill={termIsLight ? gold : dark}/>
          )}
        </g>
      )}
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(201,168,76,0.25)" strokeWidth="1"/>
    </svg>
  );
}

// ── House Card ────────────────────────────────────────────────────────────────

    reader.readAsDataURL(file);

function ScaledCanvas({ canvasW, canvasH, children }) {
  const containerRef = useRef();
  const [scale, setScale] = useState(1);

  useEffect(() => {
    const update = () => {
      if (!containerRef.current) return;
      const { width, height } = containerRef.current.getBoundingClientRect();
      setScale(Math.min(width / canvasW, height / canvasH));
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, [canvasW, canvasH]);

  return (
    <div ref={containerRef} style={{width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center'}}>
      <div id="export-canvas" style={{
        width: canvasW, height: canvasH,
        transform: `scale(${scale})`,
        transformOrigin: 'center center',
        flexShrink: 0,
        boxShadow: '0 8px 60px rgba(0,0,0,0.6)',
      }}>
        {children}
      </div>
    </div>
  );
}

        }]
      });

      const cleaned = res.replace(/```json|```/g, '').trim();
      const jsonMatch = cleaned.match(/\[[\s\S]*\]/);
      if (!jsonMatch) throw new Error('No JSON array found. Response: ' + cleaned.slice(0, 200));
      const transits = JSON.parse(jsonMatch[0]);
      if (!Array.isArray(transits) || transits.length === 0) throw new Error('Empty transit list returned');

      setMonthlyTransits(transits);
      setLastGenerated(new Date().toISOString());
    } catch(e) {
      console.error('Transit generation error:', e);
      setTransitError(e.message || 'Something went wrong. Please try again.');
    }
    setTransitsLoading(false);
  };

  const exportData = () => {
    const data = { month, year, affirmation, birth, houses, tweaks, monthlyTransits };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mood-board-${month}-${year}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.month) setMonth(d.month);
        if (d.year) setYear(d.year);
        if (d.affirmation !== undefined) setAffirmation(d.affirmation);
        if (d.birth) setBirth(d.birth);
        if (d.houses) setHouses(prev => {
          const merged = {...prev};
          Object.keys(d.houses).forEach(k => {
            merged[k] = { ...prev[k], ...d.houses[k], loading: false };
          });
          return merged;
        });
        if (d.tweaks) setTweaks(t => ({...t, ...d.tweaks}));
        if (d.monthlyTransits) setMonthlyTransits(d.monthlyTransits);
      } catch(err) { alert('Could not read file. Make sure it\'s a valid mood board export.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const importRef = useRef();

  const resetForNewMonth = () => {
    if (!confirm('Start a fresh board for a new month? Your birth data and images will be kept.')) return;
    setHouses(h => {
      const reset = {};
      Object.keys(h).forEach(k => {
        reset[k] = { ...DEFAULT_HOUSES[k], image: h[k].image };
      });
      return reset;
    });
    setAffirmation('');
    setMonthlyTransits([]);
  };

  const moonPhase = getMoonPhase(year, MONTHS.indexOf(month));
  const moonName = getMoonPhaseName(moonPhase);

  return (
    <div style={{maxWidth:900, margin:'0 auto', padding:'52px 36px 64px'}}>

      {/* ── Header ── */}
      <header style={{marginBottom:44}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:28}}>
          <div style={{flex:1}}>
            {/* Month + Year */}
            <div style={{display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:14}}>
              <select
                value={month}
                onChange={e => setMonth(e.target.value)}
                style={{
                  background:'transparent', border:'none',
                  color:'#e8d5a3', cursor:'pointer', outline:'none',
                  fontFamily:'Playfair Display, serif',
                  fontSize: 'clamp(32px, 4.5vw, 58px)',
                  fontWeight: 700, appearance:'none', padding:0,
                }}
              >
                {MONTHS.map(m => <option key={m} value={m} style={{background:'#0d0d1a'}}>{m}</option>)}
              </select>
              <input
                type="number"
                value={year}
                onChange={e => setYear(+e.target.value)}
                style={{
                  background:'transparent', border:'none', outline:'none',
                  fontFamily:'Playfair Display, serif',
                  fontSize: 'clamp(32px, 4.5vw, 58px)',
                  fontWeight: 400, color:'rgba(232,213,163,0.4)', width:'5ch', padding:0, minWidth:0,
                  textAlign:'right',
                }}
              />
            </div>
            {/* Affirmation — auto-generated */}
            <div style={{
              borderBottom:'1px solid rgba(201,168,76,0.18)',
              padding:'4px 0', minHeight:48,
              display:'flex', alignItems:'center', gap:10,
            }}>
              {affirmation ? (
                <span style={{
                  color:'rgba(232,213,163,0.75)', fontSize:15,
                  fontStyle:'italic', fontWeight:300,
                  letterSpacing:'0.02em', lineHeight:1.6, flex:1,
                }}>{affirmation}</span>
              ) : (
                <span style={{
                  color:'rgba(232,213,163,0.3)', fontSize:14,
                  fontStyle:'italic', fontWeight:300,
                  letterSpacing:'0.02em', lineHeight:1.6, flex:1,
                }}>This will be auto-generated based on your inputs below.</span>
              )}
              <button
                className="no-print"
                onClick={generateAffirmation}
                disabled={affirmationLoading || !Object.values(houses).some(h => h.intention?.trim())}
                style={{
                  background: affirmationLoading ? 'rgba(201,168,76,0.06)' : 'rgba(201,168,76,0.1)',
                  border: '1px solid rgba(201,168,76,0.3)',
                  color: 'rgba(201,168,76,0.8)', fontSize: 9, padding: '7px 14px',
                  cursor: affirmationLoading ? 'wait' : 'pointer',
                  letterSpacing: '0.12em', textTransform: 'uppercase', flexShrink:0,
                  opacity: !Object.values(houses).some(h => h.intention?.trim()) ? 0.3 : 1,
                }}>
                {affirmationLoading ? '⟳ ...' : (affirmation ? '✦ Regenerate' : '✦ Generate Theme')}
              </button>
            </div>
          </div>


        </div>

        {/* Divider + tools */}
        <div style={{borderTop:'1px solid rgba(201,168,76,0.12)', paddingTop:20, display:'flex', flexDirection:'column', gap:12}}>
          <BirthPanel
            birth={birth}
            onUpdate={u => setBirth(p => ({...p,...u}))}
            onAutoGenerate={autoGenerateChart}
            autoLoading={autoChartLoading}
            autoError={autoChartError}
          />
          <GenerateTransitsBlock
            onGenerate={generateTransits}
            loading={transitsLoading}
            error={transitError}
            lastGenerated={lastGenerated}
            hasBirth={!!birth.chart?.trim()}
          />
          <div className="no-print" style={{display:'flex', gap:8, alignItems:'center'}}>
            <button onClick={() => setShowPrompts(p => !p)} style={{
              background: showPrompts ? 'rgba(201,168,76,0.12)' : 'transparent',
              border: '1px solid rgba(201,168,76,0.25)',
              color: showPrompts ? 'rgba(201,168,76,0.8)' : 'rgba(201,168,76,0.35)',
              fontSize: 9, padding: '6px 14px', cursor: 'pointer',
              letterSpacing: '0.1em', textTransform: 'uppercase',
            }}>
              {showPrompts ? '✦ House Descriptions On' : '◦ House Descriptions Off'}
            </button>
            <button onClick={resetForNewMonth} style={{
              background:'transparent', border:'1px solid rgba(255,255,255,0.08)',
              color:'rgba(232,213,163,0.3)', fontSize:9, padding:'6px 14px',
              cursor:'pointer', letterSpacing:'0.1em', textTransform:'uppercase',
            }}>
              New Month →
            </button>
          </div>
        </div>
      </header>

      {/* ── Monthly Transits Summary ── */}
      {monthlyTransits.length > 0 && (
        <div style={{
          marginBottom: 28, padding: '20px 24px',
          background: 'rgba(80,45,140,0.12)',
          borderLeft: '2px solid rgba(160,110,220,0.4)',
        }}>
          <div style={{
            fontSize: 10, color: 'rgba(160,110,220,0.7)',
            letterSpacing: '0.15em', textTransform: 'uppercase',
            marginBottom: 14, fontWeight: 500,
          }}>
            Key Transits · {month} {year}
          </div>
          <ul style={{listStyle:'none', display:'flex', flexDirection:'column', gap:10}}>
            {monthlyTransits.map((t, i) => (
              <li key={i} style={{
                fontSize: 13, color: 'rgba(220,210,240,0.85)',
                lineHeight: 1.6, paddingLeft: 16, position: 'relative',
              }}>
                <span style={{position:'absolute', left:0, color:'rgba(160,110,220,0.55)'}}>✦</span>
                <span dangerouslySetInnerHTML={{__html: t.replace(/\*\*(.*?)\*\*/g, '<strong style="color:rgba(232,220,255,0.95);font-weight:500">$1</strong>')}}/>
              </li>
            ))}
          </ul>
        </div>
      )}

      {/* ── Houses ── */}
      <div>
        {HOUSES.map(house => (
          <HouseCard
            key={house.num}
            house={house}
            data={houses[house.num]}
            tweaks={tweaks}
            showPrompt={showPrompts}
            onUpdate={u => updateHouse(house.num, u)}
            onVisualize={visualize}
          />
        ))}
      </div>

      {/* ── Footer ── */}
      <footer style={{
        marginTop:36, paddingTop:24,
        borderTop:'1px solid rgba(201,168,76,0.1)',
        display:'flex', justifyContent:'space-between', alignItems:'center',
        flexWrap:'wrap', gap:12,
      }}>
        <span style={{fontSize:10, color:'rgba(232,213,163,0.25)', letterSpacing:'0.12em', textTransform:'uppercase'}}>
          Chelsey's Monthly Mood Board · {month} {year}
        </span>
        <div className="no-print" style={{display:'flex', gap:8, alignItems:'center'}}>
          <button onClick={exportData} style={{
            background:'transparent', border:'1px solid rgba(201,168,76,0.2)',
            color:'rgba(201,168,76,0.5)', fontSize:9, padding:'8px 14px',
            cursor:'pointer', letterSpacing:'0.12em', textTransform:'uppercase',
          }}>↓ Export</button>
          <button onClick={() => importRef.current.click()} style={{
            background:'transparent', border:'1px solid rgba(201,168,76,0.2)',
            color:'rgba(201,168,76,0.5)', fontSize:9, padding:'8px 14px',
            cursor:'pointer', letterSpacing:'0.12em', textTransform:'uppercase',
          }}>↑ Import</button>
          <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={importData}/>
          <button onClick={() => setShowExport(true)} style={{
            background:'rgba(201,168,76,0.08)', border:'1px solid rgba(201,168,76,0.3)',
            color:'rgba(201,168,76,0.75)', fontSize:9, padding:'8px 14px',
            cursor:'pointer', letterSpacing:'0.12em', textTransform:'uppercase',
          }}>⊞ One-Page View</button>
          <button
            className="print-btn"
            onClick={() => window.print()}
            style={{
              background:'transparent', border:'1px solid rgba(201,168,76,0.25)',
              color:'rgba(201,168,76,0.6)', fontSize:9, padding:'8px 18px',
              cursor:'pointer', letterSpacing:'0.12em', textTransform:'uppercase',
            }}
          >
            Print / Save PDF
          </button>
        </div>
      </footer>

      <TweaksPanel tweaks={tweaks} onChange={handleTweaks} visible={tweaksVisible}/>

      {showExport && (
        <ExportView
          houses={HOUSES}
          houseData={houses}
          month={month}
          year={year}
          affirmation={affirmation}
          onClose={() => setShowExport(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
